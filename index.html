<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SN AXIS</title>

    <!-- Pre-boot bridge: a PLAIN near-black frame that paints on the very first
         frame (before Svelte boots) so there's no white/unstyled flash. NO logo —
         the animated carbon-wave + AXIS wordmark splash is the in-app Splash.svelte
         (owner: no logo on black). main.ts adds .ready once Svelte mounts, fading
         this out under the real splash. -->
    <style>
      html, body { background: #070809; }
      #splash {
        position: fixed;
        inset: 0;
        background: #070809;
        z-index: 9999;
        transition: opacity 300ms ease-out;
      }
      #splash.ready { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
